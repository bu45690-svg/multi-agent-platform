services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     agent
      POSTGRES_PASSWORD: secret
      POSTGRES_DB:       agentdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:       postgresql://agent:secret@postgres:5432/agentdb
      LLM_PROVIDER:       gemini
      GEMINI_API_KEY:     ${GEMINI_API_KEY}
      WEB_SEARCH_BACKEND: stub
      BRAVE_API_KEY:      ""
      SERPER_API_KEY:     ""
      EMBED_MODEL:        local
      DOCS_DIR:           /app/docs
      INDEX_CACHE_DIR:    /app/.index_cache
      RAG_CHUNK_SIZE:     "400"
      RAG_CHUNK_STRIDE:   "100"
      EVAL_CONCURRENCY:   "3"
      LOG_LEVEL:          INFO
    volumes:
      - index_cache:/app/.index_cache
      - ./docs:/app/docs:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  logviewer:
    build:
      context: .
      dockerfile: logviewer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agent:secret@postgres:5432/agentdb
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  index_cache: